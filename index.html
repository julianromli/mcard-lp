<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Both faces are self-hosted, so there is no third-party handshake ahead
         of first paint. Only the latin variable file is preloaded: it carries
         every weight the page uses, and the mono is one line far below the fold. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/plus-jakarta-sans-latin.woff2"
      crossorigin
    />
    <!-- The hero photo is the LCP element but sits behind the JS bundle in the
         discovery order, so it is fetched up front at high priority instead. -->
    <link
      rel="preload"
      as="image"
      href="./mcard-hero.avif"
      type="image/avif"
      fetchpriority="high"
    />
    <title>MCard · Kartu Virtual & Spend Management | Mayar</title>
    <!-- The page shipped with no icon of any kind, so the tab carried the
         browser's blank-document glyph. The apple-touch file is flattened onto
         white: iOS discards alpha and would otherwise composite onto black. -->
    <link rel="icon" href="/mayar-icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/mayar-icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/mayar-apple-touch-180.png" />
    <meta
      name="description"
      content="Terbitkan kartu virtual tanpa batas, atur anggaran per tim, dan pantau tiap transaksi real-time. Semua dari satu dashboard."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
